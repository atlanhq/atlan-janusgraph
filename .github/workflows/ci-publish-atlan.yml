name: CI Release Atlan artifacts

on:
  push:
    tags:
      - v*.*.*-atlan*
    branches:
      - main
      - master
      - develop
      - v1.0-atlan
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.2-atlan)'
        required: true
        default: '1.0.2-atlan'

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "8.0.382+5"
          java-package: jdk
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
          architecture: x64
      
      - name: Install pip3
        run: sudo apt-get update && sudo apt-get install -y python3-pip
      
      - name: Set Atlan JanusGraph versions environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export RELEASE_TAG="v${{ github.event.inputs.version }}"
            export JG_VER="${{ github.event.inputs.version }}"
          else
            export RELEASE_TAG=${{github.ref_name}}
            export JG_VER="${RELEASE_TAG//v/}"
          fi
          export JG_DIST_NAME="atlan-janusgraph-${JG_VER}"
          export JG_FULL_DIST_NAME="atlan-janusgraph-full-${JG_VER}"
          export JG_DOC_DIST_NAME="${JG_DIST_NAME}-doc"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "JG_VER=${JG_VER}" >> $GITHUB_ENV
          echo "JG_DIST_NAME=${JG_DIST_NAME}" >> $GITHUB_ENV
          echo "JG_FULL_DIST_NAME=${JG_FULL_DIST_NAME}" >> $GITHUB_ENV
          echo "JG_DOC_DIST_NAME=${JG_DOC_DIST_NAME}" >> $GITHUB_ENV
      
      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.m2/
          echo "<settings><servers><server><id>github</id><username>$GITHUB_ACTOR</username><password>$ORG_PAT_GITHUB</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          ORG_PAT_GITHUB: ${{ secrets.ORG_PAT_GITHUB }}
      
              - name: Build Atlan JanusGraph JAR artifacts
                run: mvn clean install -Patlan-release -DskipTests=true -Drat.skip=true
      
              - name: Deploy Atlan JanusGraph JAR artifacts to GitHub Packages
                run: mvn deploy -Patlan-release -DskipTests=true -Drat.skip=true
      
      - name: Install requirements to build documentation
        run: pip3 install -r requirements.txt
      
      - name: Build documentation
        run: mkdocs build
      
      - name: Pack documentation into zip
        run: |
          mv site ${JG_DOC_DIST_NAME}
          zip -r ${JG_DOC_DIST_NAME}.zip ${JG_DOC_DIST_NAME}
      
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          draft: false
          tag: "${{ env.RELEASE_TAG }}"
          artifacts: "${{ env.JG_DOC_DIST_NAME }}.zip,janusgraph-dist/target/${{ env.JG_DIST_NAME }}.zip,janusgraph-dist/target/${{ env.JG_FULL_DIST_NAME }}.zip"
          name: "Atlan JanusGraph ${{ env.JG_VER }}"
          body: |
            # Atlan JanusGraph ${{ env.JG_VER }}
            
            This is Atlan's customized version of JanusGraph with DLQ (Dead Letter Queue) support for Elasticsearch mutations.
            
            ## Features
            - **DLQ Support**: Failed Elasticsearch mutations are written to Kafka for later replay
            - **Retry Logic**: Automatic retry with exponential backoff for transient failures
            - **Kafka Integration**: Uses Kafka as the Dead Letter Queue backend
            - **Replay Service**: Built-in service to replay failed mutations
            
            ## Usage
            
            Add to your `pom.xml`:
            ```xml
            <dependency>
               <groupId>com.atlan</groupId>
               <artifactId>atlan-janusgraph-core</artifactId>
               <version>${{ env.JG_VER }}</version>
            </dependency>
            ```
            
            ## Configuration
            
            Enable DLQ in your `atlas-application.properties`:
            ```properties
            # Enable DLQ for failed Elasticsearch mutations
            index.dlq.enabled=true
            index.dlq.kafka-bootstrap-servers=localhost:9092
            index.dlq.kafka-topic=ATLAS_ES_DLQ
            ```
            
            ## DLQ Replay
            
            Use the built-in replay service to process failed mutations:
            ```java
            DLQReplayService replayService = new DLQReplayService(
                "localhost:9092", 
                "ATLAS_ES_DLQ", 
                "atlan-dlq-replay-group",
                elasticSearchIndex
            );
            replayService.startReplay();
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
